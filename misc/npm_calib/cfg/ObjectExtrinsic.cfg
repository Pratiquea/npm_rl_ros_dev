#!/usr/bin/env python3
"""
Numeric entry for the <mocap body> -> object_link extrinsic, edited live in
rqt_reconfigure.

Angles are degrees here because that is what an operator types; the saved YAML
stores a quaternion so no Euler ambiguity survives to disk.

roll/pitch/yaw are the RESIDUAL after the nearest 90-deg element is factored
out, not the absolute orientation. Absolute RPY is singular at pitch=+-90,
which is exactly where an axis-aligned mocap pivot calibrates, so absolute
sliders lose a DOF and jump by 180 deg on the smallest drag. The residual sits
near identity instead. Range is +-70: the cube group's covering radius is
62.65 deg, so every reachable residual fits, and pitch still clears its own
singularity by 20 deg.
"""
PACKAGE = "npm_calib"

from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, double_t

gen = ParameterGenerator()

gen.add("x", double_t, 0, "translation x (m)", 0.0, -2.0, 2.0)
gen.add("y", double_t, 0, "translation y (m)", 0.0, -2.0, 2.0)
gen.add("z", double_t, 0, "translation z (m)", 0.0, -2.0, 2.0)
gen.add("roll", double_t, 0, "residual fixed-axis roll after the 90-deg snap (deg)", 0.0, -70.0, 70.0)
gen.add("pitch", double_t, 0, "residual fixed-axis pitch after the 90-deg snap (deg)", 0.0, -70.0, 70.0)
gen.add("yaw", double_t, 0, "residual fixed-axis yaw after the 90-deg snap (deg)", 0.0, -70.0, 70.0)

exit(gen.generate(PACKAGE, "object_calib_node", "ObjectExtrinsic"))
