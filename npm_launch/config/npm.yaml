object_mass: 10.0             # kg.
friction: 0.95                # static friction
world_frame: world            # world frame name, all the computation in the pipeline happens in this frame.
object_frame: object_link     # link frame, shared by all objects; the mocap link 
                              # frame for all the object map to this frame
root_frame: odom              # spot bosdyn command task root
device: cpu                   # policy inference device

object_extrinsic_frame: object_link    # calibrated object link frame
# object_body / object_parent_frame / object_pose_topic are in this config file: 
# Each object has its own config file in config/objects/<object>.yaml,which is
# selected by the "object" launch arg and loaded after this file.

object_state_topic: /npm/object_state  # filtered state from object_state_node
state_timeout_s: 0.5       # timeout for object_state_node to publish a new state
rate_hz: 20.0              # coordinator state-machine freq
marker_rate_hz: 20.0       # debug marker publish rate
vel_arrow_scale: 1.0       # m per (m/s) for the rviz velocity arrow publisher
normal_marker_len: 0.05    # m, rviz normal line length

# The pcl that goes into observation vector of the NN. For viz it will be displayed
# at this origin.
raw_obs_origin: [0.0, 0.0, 0.0]

# Scaling for object pointcloud. This pcl is used for actual pushing only since it
# serves as an under-estimator of the object surface. This avoids pushing at the 
# very edge of the object, which might cause contact loss.
pcl_shrink: 0.92           # 1.0 = nominal model, no margin; 0.97 for parrallelopiped

# Live resampling of object mesh to get a pcl for policy input and viz.
pcl_resample:
  enable: true
  n_points: 128            # number of points in the final sampled pcl
  oversample: 256          # >n_points. First stage oversamples, then downsample to n_points
  rate_hz: 30.0            # node rate, not marker pub rate, since oversample+downsample takes time.
  mesh_path: ""            # default: not required if npz_path is present
  topic: /npm/debug/resampled_cloud

# Object mesh marker params for viz
mesh_marker:
  enable: true
  mode: resource           # resource = rviz loads the .obj (tiny message);
                           # triangles = TRIANGLE_LIST built here, for an rviz
  rate_hz: 20.0
  topic: /npm/debug/object_mesh
  ns: object_mesh
  # The alpha allows the resampled cloud see through the surface.
  color: [0.337, 0.706, 0.914, 0.70]    # sky blue closer to cyan
  # color: [0.800, 0.475, 0.655, 0.70]  # reddish purple

# Params for episode trajectory vizualization of the object link
traj:
  enable: true
  min_step_m: 0.005        # m, append only when the link moved this far
  max_points: 5000         # cap; a full trail drops its oldest point
  rate_hz: 5.0             # publish cap; both topics are republished whole
  width: 0.008             # m, LINE_STRIP thickness
  color: [0.941, 0.894, 0.259, 1.0]     # yellow 
  joint_name: object_link  # the single free-floating "joint" in the multidof msg;
                           # defaults to object_frame when unset
  path_topic: /npm/debug/object_path          # nav_msgs/Path
  marker_topic: /npm/debug/object_trajectory  # visualization_msgs/Marker LINE_STRIP
  multidof_topic: /npm/debug/object_traj_multidof
                           # trajectory_msgs/MultiDOFJointTrajectory: the
                           # data-bearing one. Transform + Twist per point, so
                           # the full pose and the velocity ride together with
                           # no euler convention and no flat-array index rule.

# Settled-pose memory of the object for visualization.
snapshot:
  enable: true
  topic: /npm/debug/settled_snapshots   # visualization_msgs/MarkerArray, latched
  ns: settled_object
  max: 50                  # cap; a full memory drops its oldest snapshot
  mesh_path: ""            # default: not required if npz_path is present
  color: [0.835, 0.369, 0.0, 1.0]       # vermillion; NOT the live mesh's blue
  success_color: [0.835, 0.369, 0.0, 1.0]   # green, the settle inside the circle
  # success_color: [0.0, 0.620, 0.451, 1.0]   # green, the settle inside the circle
  alpha_min: 0.35          # oldest snapshot, so the order reads off screen
  alpha_max: 0.85          # newest snapshot
  label: true              # TEXT marker with the macro-step number, own namespace
  label_size: 0.05         # m, text height
  label_z: 0.12            # m, text height above the object origin

# Object state estimator params for constant-velocity Kalman filters.
kf_sigma_a: 1.0            # linear process noise, m/s^2, (accel std)
kf_sigma_meas: 0.001       # mocap position noise std, m
kf_sigma_alpha: 1.0        # angular process noise, rad/s^2
kf_sigma_meas_ang: 0.001   # mocap orientation noise std, rad
kf_max_gap_s: 0.2          # pose dropout more than this val resets the filters

infer_timeout_s: 5.0       # timeout for /npm/infer call [coordinator node]
use_oracle: false          # for testing, scripted manual push [policy_node]

# Arm reachability params [policy_node]
reach:
  enable: true
  floor_z: 0.02             # m, in world z of the ground plane
  ground_clearance: 0.06   # m, points below this are unreachable
  normal_z_min: -0.3       # world normal z floor; do not consider downward facing points

# Inference params [policy_node]
infer:
  top_k: 3                 # get top_k push point candidates
  min_sep: 0.00            # m, minimum world-space gap between candidates; 0 = disable
  seed: -1                 # <0 means fresh stream each run; >=0 means reproducible 

# For testing only .
taper:
  enable: false            # false = don't apply taper
  taper_dist: 3.0          # m, distance to goal at which the gain reaches 1.0
  taper_force_min: 60.0    # N, floor of the tapered magnitude; NOT policy_lib.FORCE_MIN
  p_far: 0.20              # taper probability at or beyond taper_dist
  p_near: 0.70             # taper probability at the goal; capped below 1.0
  write_prev_action: false  # feed the applied magnitude to the next observation

# Misc params
dry_run: true              # true = no commands forwarded to robot, but rest works.
push_dwell_s: 4.0          # Time for push sub-steps (max_push_steps (100) / 30 fps like sim)
settle_vel_thr: 0.1        # m/s   linear thrshold to consider the object settled
settle_ang_vel_thr: 0.1    # rad/s angular thrshold to consider the object settled
settle_timeout_s: 16.667   # Timeout for settling(max_settle_steps 500 / 30 fps)
settle_hold_s: 0.5         # Time window to hold before declaring the object settled
max_macro_steps: 0         # max steps before episode ends, 0 = unlimited

# User input to step state-machine required for testing/demo.
# These are overridden by the launch arg confirm_on.
confirm:
  settle: false            # true = wait for user to confirm object settled, false = autonomous
  pre_push: false          # true = wait for user to confirm before starting the push, false = autonomous
success_radius: 0.5        # m, radius of circle around goal that is considered goal reached
max_finger_reach: 0.5      # m, when push point drifts beyond this, the force application is stopped. 
                           # sim variable proxy for reachability of robot arm.
arrow_len_at_max: 0.3      # m, max arrow length corresponding to max force in rviz
